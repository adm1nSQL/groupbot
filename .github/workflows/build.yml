name: Build and Release

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o v2board-tg-bot-linux-amd64 ./cmd/bot

      - name: Build Linux arm64
        run: GOOS=linux GOARCH=arm64 go build -o v2board-tg-bot-linux-arm64 ./cmd/bot

      - name: Build Windows amd64
        run: GOOS=windows GOARCH=amd64 go build -o v2board-tg-bot-windows-amd64.exe ./cmd/bot

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2board-tg-bot-${{ github.run_number }}
          path: |
            v2board-tg-bot-linux-amd64
            v2board-tg-bot-linux-arm64
            v2board-tg-bot-windows-amd64.exe
            configs/config.example.yaml
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            v2board-tg-bot-linux-amd64
            v2board-tg-bot-linux-arm64
            v2board-tg-bot-windows-amd64.exe
            configs/config.example.yaml
          generate_release_notes: true
